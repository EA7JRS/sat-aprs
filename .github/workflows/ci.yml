name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Consola web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Formatos NMEA 2000 contra CANboat (release fijada)
        run: tools/canboat/run.sh
      - run: npm run build

  agent:
    name: Agente (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
